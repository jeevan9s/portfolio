<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>
    .bg { fill: transparent; }
    .fg { fill: #1E1E1E; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: transparent; }
      .fg { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="400" height="400" rx="88" ry="88"/>
  <rect class="fg" x="50" y="50" width="300" height="300" rx="70" ry="70"/>
</svg>
